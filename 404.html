<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorendevelopment · 404 Page not found</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{display:grid;place-items:center;background:#dceeff;color:#0a192f;
       font-family:'Outfit',system-ui,sans-serif;text-align:center;padding:24px}
  .code{font-size:clamp(4rem,18vw,9rem);font-weight:800;letter-spacing:-.04em;
        background:linear-gradient(135deg,#5eb0ff,#0a192f);
        -webkit-background-clip:text;background-clip:text;
        -webkit-text-fill-color:transparent;line-height:1}
  p{color:#33506e;margin:14px 0 28px}
  a{display:inline-flex;padding:13px 26px;border-radius:50px;
    background:linear-gradient(135deg,#5eb0ff,#3d9eff);color:#fff;text-decoration:none;
    font-weight:600;box-shadow:0 12px 32px rgba(94,176,255,.5)}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <p>The page you're looking for doesn't exist.</p>
  <a href="/">Back home</a>
</main>
</body>
</html>
